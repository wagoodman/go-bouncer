release:
  prerelease: auto

env:
  - CGO_ENABLED=0

builds:
  - id: linux-build
    binary: bouncer
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags: &build-ldflags -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.buildTime={{.Date}}`.

  - id: darwin-build
    binary: bouncer
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags: *build-ldflags

  - id: windows-build
    binary: bouncer
    goos:
      - windows
    goarch:
      - amd64
    ldflags: *build-ldflags

archives:
  - id: linux-archives
    builds:
      - linux-build

  - id: darwin-archives
    builds:
      - darwin-build

  - id: windows-archives
    format: zip
    builds:
      - windows-build
